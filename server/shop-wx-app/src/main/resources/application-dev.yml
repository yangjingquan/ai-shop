spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/shop?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: shop
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6380
      password: ${REDIS_PASSWORD}
      timeout: 3s
  flyway:
    enabled: false

logging:
  level:
    com.shop: DEBUG

knife4j:
  enabled: true

shop:
  jwt:
    secret: ${SHOP_JWT_SECRET:dev-only-shop-jwt-secret-min-32-bytes-change-me}
  cors:
    allowed-origin-patterns: http://localhost:*,http://127.0.0.1:*
