spring:
  application:
    name: shop-admin-app
  profiles:
    active: dev
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8081
  servlet:
    context-path: /

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-not-delete-value: 0
      logic-delete-value: 1
      id-type: auto

shop:
  payment-credentials:
    encryption-key: ${SHOP_PAYMENT_CREDENTIAL_ENCRYPTION_KEY:}
  jwt:
    secret: ${SHOP_JWT_SECRET}
    admin-ttl-hours: 8
    merchant-ttl-hours: 8
    wx-ttl-days: 7
  file:
    upload-dir: ${SHOP_FILE_UPLOAD_DIR:uploads}
    public-prefix: ${SHOP_FILE_PUBLIC_PREFIX:/uploads}
  security:
    trusted-proxies: ${SHOP_TRUSTED_PROXIES:127.0.0.1,::1}
  logistics:
    enabled: ${SHOP_LOGISTICS_ENABLED:true}
    cache-minutes: ${SHOP_LOGISTICS_CACHE_MINUTES:30}
    kdniao:
      ebusiness-id: ${KDNIAO_EBUSINESS_ID:}
      app-key: ${KDNIAO_APP_KEY:}
      query-url: ${KDNIAO_QUERY_URL:https://api.kdniao.com/api/dist}
      request-type: ${KDNIAO_REQUEST_TYPE:8002}
      timeout-ms: ${KDNIAO_TIMEOUT_MS:5000}
  jobs:
    order-timeout-enabled: false
    auto-receive-enabled: false
    payment-reconcile-enabled: false
    refund-reconcile-enabled: false
