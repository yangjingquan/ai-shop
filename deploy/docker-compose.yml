services:
  mysql:
    image: mysql:8.0
    container_name: shop-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - shop-mysql-data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      retries: 20
      start_period: 40s
    networks:
      - shop-net

  redis:
    image: redis:7-alpine
    container_name: shop-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - shop-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      retries: 10
    networks:
      - shop-net

  shop-admin-app:
    build:
      context: ./admin-app
    container_name: shop-admin-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SHOP_JWT_SECRET: ${SHOP_JWT_SECRET}
      SHOP_TRUSTED_PROXIES: ${SHOP_TRUSTED_PROXIES:-172.16.0.0/12,127.0.0.1,::1}
      SHOP_BOOTSTRAP_ADMIN_PASSWORD: ${SHOP_BOOTSTRAP_ADMIN_PASSWORD:-}
      SHOP_BOOTSTRAP_MERCHANT_PASSWORD: ${SHOP_BOOTSTRAP_MERCHANT_PASSWORD:-}
      SHOP_PAYMENT_CREDENTIAL_ENCRYPTION_KEY: ${SHOP_PAYMENT_CREDENTIAL_ENCRYPTION_KEY}
      WX_APPID: ${WX_APPID}
      WX_SECRET: ${WX_SECRET}
      SHOP_FILE_UPLOAD_DIR: /data/shop/uploads
      SHOP_FILE_PUBLIC_PREFIX: /uploads
      SHOP_LOG_FILE: /data/shop/logs/shop-admin-app.log
      KDNIAO_EBUSINESS_ID: ${KDNIAO_EBUSINESS_ID:-}
      KDNIAO_APP_KEY: ${KDNIAO_APP_KEY:-}
      KDNIAO_REQUEST_TYPE: ${KDNIAO_REQUEST_TYPE:-8002}
      SHOP_CORS_ALLOWED_ORIGIN_PATTERNS: "https://console.nexbyte.top"
      TZ: Asia/Shanghai
    volumes:
      - ./uploads:/data/shop/uploads
      - ./logs/admin-app:/data/shop/logs
    networks:
      - shop-net

  shop-wx-app:
    build:
      context: ./wx-app
    container_name: shop-wx-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SHOP_JWT_SECRET: ${SHOP_JWT_SECRET}
      SHOP_TRUSTED_PROXIES: ${SHOP_TRUSTED_PROXIES:-172.16.0.0/12,127.0.0.1,::1}
      SHOP_BOOTSTRAP_ADMIN_PASSWORD: ${SHOP_BOOTSTRAP_ADMIN_PASSWORD:-}
      SHOP_BOOTSTRAP_MERCHANT_PASSWORD: ${SHOP_BOOTSTRAP_MERCHANT_PASSWORD:-}
      SHOP_PAYMENT_CREDENTIAL_ENCRYPTION_KEY: ${SHOP_PAYMENT_CREDENTIAL_ENCRYPTION_KEY}
      WX_APPID: ${WX_APPID}
      WX_SECRET: ${WX_SECRET}
      SHOP_FILE_UPLOAD_DIR: /data/shop/uploads
      SHOP_FILE_PUBLIC_PREFIX: /uploads
      SHOP_LOG_FILE: /data/shop/logs/shop-wx-app.log
      KDNIAO_EBUSINESS_ID: ${KDNIAO_EBUSINESS_ID:-}
      KDNIAO_APP_KEY: ${KDNIAO_APP_KEY:-}
      KDNIAO_REQUEST_TYPE: ${KDNIAO_REQUEST_TYPE:-8002}
      TZ: Asia/Shanghai
    volumes:
      - ./uploads:/data/shop/uploads
      - ./logs/wx-app:/data/shop/logs
    networks:
      - shop-net

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    image: shop-nginx:local
    container_name: shop-nginx
    restart: unless-stopped
    depends_on:
      - shop-admin-app
      - shop-wx-app
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8081:81"
      - "127.0.0.1:8082:82"
      - "443:443"
    volumes:
      # Keep TLS material outside the release directory so code syncs cannot remove it.
      - ${SHOP_TLS_DIR:-/etc/shop/tls}:/etc/nginx/ssl:ro
      - ./uploads:/usr/share/nginx/html/uploads:ro
      - ./logs/nginx:/var/log/nginx
    healthcheck:
      test: ["CMD-SHELL", "test -s /usr/share/nginx/html/console/index.html && wget -q --no-check-certificate -O /dev/null --header='Host: console.nexbyte.top' https://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - shop-net

networks:
  shop-net:
    driver: bridge

volumes:
  shop-mysql-data:
  shop-redis-data:
