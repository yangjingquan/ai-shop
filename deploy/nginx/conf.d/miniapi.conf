# 小程序接口 - IP:8082（http，小程序调试用需要在开发者工具勾"不校验域名"）
server {
    listen 82 default_server;
    server_name _;

    client_max_body_size 20m;

    location /uploads/ {
        alias /usr/share/nginx/html/uploads/;
        expires 30d;
        access_log off;
    }

    location / {
        # Resolve the Docker service at request time so a recreated wx-app
        # container does not leave Nginx pointing at its old IP.
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $wx_upstream shop-wx-app;
        proxy_pass http://$wx_upstream:8082;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# 小程序接口正式域名 - HTTPS（微信小程序线上环境必须使用 HTTPS）
server {
    listen 443 ssl;
    server_name miniapi.nexbyte.top;

    ssl_certificate     /etc/nginx/ssl/miniapi.nexbyte.top.pem;
    ssl_certificate_key /etc/nginx/ssl/miniapi.nexbyte.top.key;

    client_max_body_size 20m;

    location /uploads/ {
        alias /usr/share/nginx/html/uploads/;
        expires 30d;
        access_log off;
    }

    location / {
        # Resolve the Docker service at request time so a recreated wx-app
        # container does not leave Nginx pointing at its old IP.
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $wx_upstream shop-wx-app;
        proxy_pass http://$wx_upstream:8082;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
