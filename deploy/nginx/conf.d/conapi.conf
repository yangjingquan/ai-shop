# 后台管理接口禁止通过 HTTP 直连；正式入口使用 conapi.nexbyte.top HTTPS。
server {
    listen 81 default_server;
    server_name _;
    return 444;
}

# 后台管理接口正式域名 - HTTPS
server {
    listen 443 ssl;
    server_name conapi.nexbyte.top www.conapi.nexbyte.top;

    ssl_certificate     /etc/nginx/ssl/conapi.nexbyte.top.pem;
    ssl_certificate_key /etc/nginx/ssl/conapi.nexbyte.top.key;

    client_max_body_size 20m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /uploads/ {
        alias /usr/share/nginx/html/uploads/;
        expires 30d;
        access_log off;
    }

    location / {
        # Resolve the Docker service at request time so a recreated admin
        # container does not prevent Nginx from starting or retain a stale IP.
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $admin_upstream shop-admin-app;
        proxy_pass http://$admin_upstream:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
