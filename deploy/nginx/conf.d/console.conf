# 后台管理页面 - IP:8080 直连
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 20m;

    root /usr/share/nginx/html/console;
    index index.html;

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /uploads/ {
        alias /usr/share/nginx/html/uploads/;
        expires 30d;
        access_log off;
    }
}

# 后台管理页面正式域名 - HTTPS
server {
    listen 443 ssl;
    server_name console.nexbyte.top www.console.nexbyte.top;

    ssl_certificate     /etc/nginx/ssl/console.nexbyte.top.pem;
    ssl_certificate_key /etc/nginx/ssl/console.nexbyte.top.key;

    client_max_body_size 20m;

    root /usr/share/nginx/html/console;
    index index.html;

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /uploads/ {
        alias /usr/share/nginx/html/uploads/;
        expires 30d;
        access_log off;
    }
}
