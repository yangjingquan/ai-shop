# 所有公开 HTTP 请求统一升级到 HTTPS；IP 直连不提供管理页面。
server {
    listen 80 default_server;
    server_name console.nexbyte.top www.console.nexbyte.top
                conapi.nexbyte.top www.conapi.nexbyte.top miniapi.nexbyte.top;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name _;
    return 444;
}

# 后台管理页面正式域名 - HTTPS
server {
    listen 443 ssl;
    server_name console.nexbyte.top www.console.nexbyte.top;

    ssl_certificate     /etc/nginx/ssl/console.nexbyte.top.pem;
    ssl_certificate_key /etc/nginx/ssl/console.nexbyte.top.key;

    client_max_body_size 20m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /usr/share/nginx/html/console;
    index index.html;

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }

    # Return a clear service failure when the SPA entry page is absent instead
    # of a directory-index 403 or an internal redirection-loop 500.
    location = /index.html {
        try_files /index.html =503;
    }

    location /uploads/ {
        alias /usr/share/nginx/html/uploads/;
        expires 30d;
        access_log off;
    }
}
