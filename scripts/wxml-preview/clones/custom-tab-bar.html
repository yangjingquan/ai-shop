<!DOCTYPE html><html><head><meta charset="utf-8"><style>
body{width:375px;height:220px;margin:0;background:#F6F6F8;position:relative}
.tab-bar{position:fixed;left:12px;right:12px;bottom:18px;z-index:1000;display:flex;height:62px;padding:0 6px;box-sizing:border-box;background:rgba(255,255,255,.96);border-radius:31px;box-shadow:0 10px 30px rgba(20,22,28,.12)}
.tab-item{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#9A9EA8;font-size:10px}
.tab-icon{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,#EDEEF2,#D5D8E0)}
.tab-item.is-active{color:#FF4A1C;font-weight:700}
.tab-item.is-active .tab-icon{background:linear-gradient(135deg,#FF4A1C,#FF8A00)}
</style></head><body>
<div class="tab-bar">
<div class="tab-item"><div class="tab-icon"></div>首页</div>
<div class="tab-item"><div class="tab-icon"></div>分类</div>
<div class="tab-item"><div class="tab-icon"></div>购物车</div>
<div class="tab-item"><div class="tab-icon"></div>订单</div>
<div class="tab-item is-active"><div class="tab-icon"></div>我的</div>
</div>
</body></html>
