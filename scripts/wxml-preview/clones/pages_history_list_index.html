<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}body{width:375px;font-family:"PingFang SC",sans-serif;background:#F6F6F8}
.hero{background:linear-gradient(160deg,#FF4A1C,#FF8A00);color:#fff;padding:6px 16px 20px;position:relative}
.k{font-size:10px;letter-spacing:2.5px;font-weight:800}.t{font-size:28px;font-weight:900;margin:4px 0 2px}.s{font-size:12px;opacity:.88}
.clear{position:absolute;right:16px;top:50px;height:28px;padding:0 12px;border:1px solid rgba(255,255,255,.6);border-radius:14px;background:rgba(255,255,255,.2);color:#fff;font-size:12px;line-height:26px}
.sh{display:flex;justify-content:space-between;margin:16px;padding:0 16px}.sh b{font-size:17px}.sub{font-size:12px;color:#9A9EA8}
.row{display:flex;gap:10px;margin:0 16px 6px}
.tl{width:14px;display:flex;flex-direction:column;align-items:center}
.tl .d{width:10px;height:10px;border-radius:5px;background:#FF4A1C;margin-top:20px}
.tl .l{flex:1;width:2px;background:#ECEDF0;margin-top:4px}
.card{background:#fff;border-radius:16px;padding:10px;flex:1;display:flex;gap:10px;box-shadow:0 4px 18px rgba(20,22,28,.04)}
.img{width:84px;height:84px;border-radius:12px;background:linear-gradient(135deg,#F0E6FF,#D6C2FF);flex:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.name{flex:1;min-width:0;font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.del{flex:none;height:24px;padding:0 10px;border:1px solid #ECEDF0;border-radius:12px;font-size:11px;line-height:22px;background:#fff}
.price{color:#FF4A1C;font-size:16px;font-weight:800;margin-top:4px;display:block}
.meta{font-size:11px;color:#9A9EA8;margin-top:4px;display:block}
</style></head><body>
<div class="hero"><div class="k">RECENTLY VIEWED</div><div class="t">浏览记录</div><div class="s">最近看过的商品，都留在这里</div><span class="clear">清空</span></div>
<div class="sh"><b>最近浏览</b><span class="sub">共 3 件商品</span></div>
<div class="row"><div class="tl"><div class="d"></div><div class="l"></div></div><div class="card"><div class="img"></div><div style="flex:1;min-width:0"><div class="top"><span class="name">锋悦中性笔 0.5mm 黑色</span><span class="del">删除</span></div><span class="price">¥15.00</span><span class="meta">浏览于 2026-10-17 12:50 · 已浏览 8 次</span></div></div></div>
</body></html>
