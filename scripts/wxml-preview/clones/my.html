<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}body{width:375px;font-family:"PingFang SC",sans-serif;background:#F6F6F8}
.hero{background:linear-gradient(160deg,#FF4A1C,#FF8A00);color:#fff;padding-bottom:70px}
.pf{padding:8px 20px 0}.pm{display:flex;gap:14px;align-items:center}
.av{width:68px;height:68px;border-radius:24px;background:linear-gradient(135deg,#FFE3D6,#fff);border:3px solid rgba(255,255,255,.7)}
.kk{font-size:11px;opacity:.8;color:#fff}.nk{font-size:22px;font-weight:900;margin:2px 0 6px;color:#fff}
.tier{display:inline-flex;align-items:center;gap:6px;background:#15161C;border-radius:14px;padding:4px 10px 4px 4px;font-size:11px;color:#fff}
.tier .m{width:18px;height:18px;border-radius:9px;background:#FFD23F;color:#15161C;font-weight:900;display:flex;align-items:center;justify-content:center}
.tier b{color:#FFD23F}
.ph{margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.25);display:flex;justify-content:space-between;font-size:13px;color:#fff}
.dot{width:8px;height:8px;border-radius:4px;background:#7CFFB2;display:inline-block;margin-right:6px}
.my-body{padding:0 16px}
.pts{margin:-54px 0 12px;display:flex;background:#fff;border-radius:20px;box-shadow:0 10px 30px rgba(255,74,28,.12);overflow:hidden}
.pts .m{flex:1;padding:16px 18px}.pts .l{font-size:12px;color:#5B5F6B}.pts .v{font-size:32px;font-weight:900}.pts .d{font-size:11px;color:#FF4A1C;font-weight:700}
.pts .dy{width:130px;background:linear-gradient(160deg,#FFD23F,#FFB400);padding:16px 14px;display:flex;flex-direction:column;justify-content:center;font-weight:900;font-size:15px}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 4px 18px rgba(20,22,28,.04)}
.hdg{display:flex;align-items:baseline;gap:8px;margin-bottom:14px}.h2{font-size:17px;font-weight:800}.sub{font-size:12px;color:#9A9EA8}
.sg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.si{text-align:center;font-size:12px;color:#5B5F6B;position:relative}
.t1{background:linear-gradient(135deg,#FFE3D6,#FFC2A8)}.t2{background:linear-gradient(135deg,#E3ECFF,#BFD3FF)}.t3{background:linear-gradient(135deg,#DDF7EC,#AEEBD1)}.t4{background:linear-gradient(135deg,#FFF3C9,#FFE08A)}.t5{background:linear-gradient(135deg,#F0E6FF,#D6C2FF)}
.si i{display:block;width:44px;height:44px;margin:0 auto 6px;border-radius:15px}
.ag{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ai{background:#F6F6F8;border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center}
.ai i{width:36px;height:36px;border-radius:12px;flex:none}
.ai .t{font-weight:800;font-size:14px;display:block}.ai .d{font-size:10px;color:#9A9EA8;display:block;margin-top:2px}
</style></head><body>
<div class="hero"><div class="pf"><div class="pm"><div class="av"></div><div><div class="kk">我的昵称</div><div class="nk">杨小胖</div><div class="tier"><span class="m">V</span>会员等级 <b>普通会员</b> Lv.1 ›</div></div></div>
<div class="ph"><span><span class="dot"></span>已绑定手机号</span><span>›</span></div></div></div>
<div class="my-body">
<div class="pts"><div class="m"><div class="l">我的积分</div><div class="v">61</div><div class="d">去积分商城兑换好礼 →</div></div><div class="dy">积分会员日<span style="font-size:11px;font-weight:600">每月8日 ›</span></div></div>
<div class="card"><div class="hdg"><div class="h2">常用服务</div><div class="sub">账户与订单服务</div></div>
<div class="sg"><div class="si"><i class="t2"></i>消息中心</div><div class="si"><i class="t3"></i>收货地址</div><div class="si"><i class="t1"></i>我的订单</div><div class="si"><i class="t4"></i>优惠券</div><div class="si"><i class="t5"></i>分享有礼</div></div></div>
<div class="card"><div class="hdg"><div class="h2">商品服务</div><div class="sub">收藏与浏览足迹</div></div>
<div class="ag"><div class="ai"><i class="t1"></i><div><span class="t">我的收藏</span><span class="d">收藏的心仪商品</span></div></div><div class="ai"><i class="t2"></i><div><span class="t">浏览记录</span><span class="d">最近看过的商品</span></div></div></div></div>
</div>
</body></html>
