<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}body{width:375px;font-family:"PingFang SC",sans-serif;background:#F6F6F8;color:#15161C}
.page-hero-dark{background:linear-gradient(150deg,#15161C,#2E3140);color:#fff;overflow:hidden;position:relative}
.seckill-hd{padding:6px 16px 20px;position:relative;z-index:1}
.seckill-kicker{font-size:10px;font-weight:800;letter-spacing:2.5px;color:#FFD23F}
.hero-kicker-row{display:flex;align-items:center;gap:8px}
.tag-yellow{background:#FFD23F;color:#15161C;font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px}
.seckill-title{margin-top:4px;font-size:28px;font-weight:900;line-height:1.2;color:#fff}
.seckill-subtitle{margin-top:4px;font-size:12px;opacity:.88;color:#fff}
.seckill-countdown{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding:12px 14px;border-radius:16px;background:rgba(0,0,0,.18)}
.seckill-countdown-value{display:block;margin-top:4px;font-size:26px;font-weight:900;letter-spacing:2px;color:#fff}
.seckill-countdown-dot{width:6px;height:6px;border-radius:3px;background:#FFD23F;margin-left:6px;display:inline-block}
.seckill-countdown-hint{font-size:11px;opacity:.85;color:#fff}
.session-chips-row{display:flex;flex-direction:row;gap:8px;padding:0 16px 16px;overflow-x:auto}
.session-chip{flex:0 0 96px;width:96px;padding:8px;border-radius:14px;background:rgba(255,255,255,.15);color:#fff;text-align:center}
.session-chip-active{background:#fff;color:#FF4A1C}
.session-chip-name{display:block;font-size:13px;font-weight:700}
.session-chip-time{display:block;font-size:15px;font-weight:900;margin-top:2px}
.session-chip-status{display:block;font-size:10px;margin-top:2px}
.card{background:#fff;border-radius:16px;margin:-8px 16px 0;padding:16px;box-shadow:0 4px 18px rgba(20,22,28,.04);position:relative}
.session-live{font-size:11px;font-weight:700;padding:3px 8px;border-radius:10px;background:#FFF1EB;color:#FF4A1C}
.session-range,.session-desc{display:block;font-size:12px;color:#9A9EA8;margin-top:4px}
.seckill-product-row{display:flex;gap:12px;padding:12px 0;border-top:1px solid #ECEDF0}
.product-image{width:104px;height:104px;border-radius:12px;background:linear-gradient(135deg,#E3ECFF,#BFD3FF);flex:none}
.product-name{font-weight:700;font-size:14px}
.product-spec{font-size:11px;color:#9A9EA8;margin-top:3px;display:block}
.product-price{color:#FF4A1C;font-size:22px;font-weight:900}
.product-original{color:#9A9EA8;font-size:11px;text-decoration:line-through;margin-left:6px}
.stock-row{font-size:10px;color:#9A9EA8;display:flex;gap:6px;margin-top:4px}
.stock-highlight{color:#FF4A1C;font-weight:700}
.limit-line{margin-left:auto}
.stock-track{height:6px;border-radius:4px;background:#FFF1EB;margin:6px 0 8px;overflow:hidden}
.stock-fill{height:100%;width:62%;background:linear-gradient(90deg,#FF8A00,#FF4A1C)}
.product-cta-row{display:flex;justify-content:flex-end}
.buy-pill{display:inline-flex;align-items:center;justify-content:center;height:30px;padding:0 14px;border-radius:15px;background:linear-gradient(90deg,#FF4A1C,#FF8A00);color:#fff;font-size:12px;font-weight:700}
</style></head><body>
<div class="page-hero-dark">
<div class="seckill-hd">
<div class="hero-kicker-row"><span class="seckill-kicker">LIMITED TIME SALE</span><span class="tag-yellow">限时会场</span></div>
<div class="seckill-title">秒杀限时折扣</div>
<div class="seckill-subtitle">精选好物，限时低价抢</div>
<div class="seckill-countdown"><div><div style="font-size:12px;color:#fff">距结束 <span class="seckill-countdown-dot"></span></div><span class="seckill-countdown-value">01:23:45</span></div><span class="seckill-countdown-hint">先到先得 · 售完即止</span></div>
</div>
<div class="session-chips-row">
<div class="session-chip"><span class="session-chip-name">● 场次1</span><span class="session-chip-time">10:00</span><span class="session-chip-status">已结束</span></div>
<div class="session-chip session-chip-active"><span class="session-chip-name">● 场次2</span><span class="session-chip-time">14:00</span><span class="session-chip-status">抢购中</span></div>
<div class="session-chip"><span class="session-chip-name">● 场次3</span><span class="session-chip-time">20:00</span><span class="session-chip-status">即将开始</span></div>
</div>
</div>
<div class="card">
<div><b style="font-size:16px">场次2</b> <span class="session-live">限量抢购</span><span class="session-range">10-16 14:00 - 10-16 18:00</span><span class="session-desc">限时特价，售完即止</span></div>
<div class="seckill-product-row">
<div class="product-image"></div>
<div style="flex:1;min-width:0"><div class="product-name">秒杀商品名称</div><span class="product-spec">精选规格</span><div style="margin:4px 0"><span class="product-price">¥9.90</span><span class="product-original">¥29.90</span></div>
<div class="stock-row"><span class="stock-highlight">仅剩 62 件</span><span>剩余62%</span><span class="limit-line">每人限购2件</span></div>
<div class="stock-track"><div class="stock-fill"></div></div>
<div class="product-cta-row"><span class="buy-pill">立即抢</span></div></div>
</div>
</div>
</body></html>
