<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;width:375px;background:#F6F6F8;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
button{margin:0;padding:0;border:none;background:transparent;width:auto;display:inline-flex;align-items:center;justify-content:center}
button::after{display:none}
button.btn-block,.btn-block{width:100%;display:flex}
button.btn-primary,button.btn.btn-primary{background:linear-gradient(90deg,#FF4A1C,#FF8A00);color:#fff;border-radius:24px}
.wx-image-stub{min-width:80px;min-height:80px;background:linear-gradient(135deg,#EDEEF2,#D5D8E0);border-radius:12px}
page {
  font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'PingFang SC', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif;
  font-size: 14px;
  color: #15161C;
  background: #F6F6F8;
  --tab-bar-gap: 18px;
  --tab-bar-height: 62px;
  --tab-bar-inset: calc(var(--tab-bar-gap) + var(--tab-bar-height) + env(safe-area-inset-bottom));
  --tab-page-pad-bottom: calc(100px + env(safe-area-inset-bottom));
  --cart-checkout-height: 64px;
  --cart-page-pad-bottom: calc(100px + var(--cart-checkout-height) + 48px + env(safe-area-inset-bottom));
}

page, view, text { box-sizing: border-box; }

button {
  margin: 0;
  padding: 0;
  border: none;
  font-family: inherit;
  font-size: inherit;
  font-weight: inherit;
  color: inherit;
  line-height: inherit;
  background: transparent;
  box-sizing: border-box;
  width: auto;
  min-height: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  vertical-align: middle;
}

button::after {
  display: none;
  border: none;
}

button.btn-block,
.btn-block {
  width: 100%;
  display: flex;
  box-sizing: border-box;
}

button.btn-inline,
.btn-inline {
  width: auto;
  flex: none;
  display: inline-flex;
  max-width: none;
}

.page-shell {
  width: 100%;
  min-height: 100vh;
  background: #F6F6F8;
  box-sizing: border-box;
}

.card {
  background: #fff;
  border-radius: 16px;
  box-shadow: 0 4px 18px rgba(20, 22, 28, 0.04);
}

.section-title {
  display: flex;
  align-items: center;
  gap: 5px;
  color: #15161C;
  font-size: 19px;
  font-weight: 800;
  letter-spacing: 0.5px;
}

.section-subtitle {
  font-size: 12px;
  color: #9A9EA8;
  margin-top: 3px;
}

.section-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin: 22px 16px 12px;
}

.section-more {
  font-size: 12px;
  color: #5B5F6B;
}

.price,
.price-strong {
  color: #FF4A1C;
  font-weight: 800;
  font-family: 'DIN Alternate', 'Roboto Condensed', sans-serif;
}

.price text {
  font-size: 0.65em;
  margin-right: 1px;
}

.price-original {
  color: #9A9EA8;
  text-decoration: line-through;
  font-size: 11px;
  margin-left: 6px;
  font-weight: 400;
}

.text-primary { color: #15161C; }
.text-secondary { color: #5B5F6B; }
.text-tertiary { color: #9A9EA8; }
.text-brand { color: #FF4A1C; }
.text-yellow { color: #FFD23F; }
.text-green { color: #16C47F; }
.text-blue { color: #3D7BFF; }
.text-purple { color: #7B5CFF; }

.bg-brand-light { background: #FFF1EB; }
.bg-gray { background: #F6F6F8; }

.icon {
  width: 16px;
  height: 16px;
  display: inline-block;
  flex: 0 0 auto;
}

.icon-sm {
  width: 14px;
  height: 14px;
}

.icon-lg {
  width: 36px;
  height: 36px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: auto;
  flex: none;
  padding: 0 18px;
  border-radius: 18px;
  font-size: 14px;
  font-weight: 600;
  border: 1px solid #ECEDF0;
  background: #fff;
  color: #15161C;
}

.btn-primary,
button.btn-primary,
button.btn.btn-primary {
  height: 48px;
  border-radius: 24px;
  background: linear-gradient(90deg, #FF4A1C, #FF8A00);
  color: #fff;
  border: 0;
  font-size: 16px;
  box-shadow: 0 6px 14px rgba(255, 74, 28, 0.28);
}

.btn-dark {
  height: 36px;
  border-radius: 18px;
  background: #15161C;
  color: #fff;
  border: 0;
  font-size: 14px;
}

.btn-outline {
  height: 36px;
  border-radius: 18px;
  background: #fff;
  color: #15161C;
  border: 1px solid #ECEDF0;
  font-size: 14px;
}

.btn-ghost {
  height: 36px;
  border-radius: 18px;
  background: #fff;
  color: #FF4A1C;
  border: 1px solid #FF4A1C;
  font-size: 14px;
}

.btn-danger {
  background: #FF4A1C;
  color: #fff;
  border: 0;
}

.btn-disabled {
  background: #E5E6EA;
  color: #A9ACB4;
  box-shadow: none;
  border: 0;
}

.btn-lg {
  height: 48px;
  border-radius: 24px;
  font-size: 16px;
  width: 100%;
  display: flex;
}

.btn-md {
  height: 36px;
  border-radius: 18px;
  font-size: 14px;
}

.btn-sm,
button.btn-sm {
  height: 30px;
  border-radius: 15px;
  font-size: 12px;
  padding: 0 14px;
}

button.btn-sm.btn-primary,
button.btn-sm.btn-ghost {
  display: inline-flex;
  width: auto;
  flex: none;
}

.tag {
  display: inline-block;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 6px;
  background: #FFF1EB;
  color: #FF4A1C;
}

.tag-yellow {
  background: #FFD23F;
  color: #15161C;
}

.tag-green {
  background: #E6FBF2;
  color: #16C47F;
}

.tag-blue {
  background: #E7F0FF;
  color: #3D7BFF;
}

.tag-purple {
  background: #F0E6FF;
  color: #7B5CFF;
}

.tag-solid {
  background: #FF4A1C;
  color: #fff;
}

/* Tab pages: bottom clearance is ONLY via .tab-bottom-spacer / .cart-bottom-spacer (no padding-bottom here — stacking caused ~2× gap). */
.pad-custom-tab-bar,
.pad-custom-tab-bar-cart {
  box-sizing: border-box;
}

/* 18px tab float offset + 62px bar + 12px breathing room (+ safe area) */
.tab-bottom-spacer {
  width: 100%;
  height: 92px;
  height: calc(92px + constant(safe-area-inset-bottom));
  height: calc(92px + env(safe-area-inset-bottom));
  flex-shrink: 0;
}

/* Tab inset (36+124) + checkout bar (~84px) + 12px above checkout */
.cart-bottom-spacer {
  width: 100%;
  height: 176px;
  height: calc(176px + constant(safe-area-inset-bottom));
  height: calc(176px + env(safe-area-inset-bottom));
  flex-shrink: 0;
}

.pad-fixed-bottom-bar {
  padding-bottom: calc(78px + env(safe-area-inset-bottom));
  box-sizing: border-box;
}

.text-ellipsis {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
}

.fixed-above-custom-tab-bar {
  bottom: var(--tab-bar-inset);
}

.note-label {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 2px;
  color: #FF4A1C;
  background: #FFF1EB;
  padding: 3px 8px;
  border-radius: 20px;
}

.status-badge {
  font-size: 11px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 10px;
}

.status-badge-active {
  background: #FFF1EB;
  color: #FF4A1C;
}

.status-badge-success {
  background: #E6FBF2;
  color: #16C47F;
}

.status-badge-gray {
  background: #ECEDF0;
  color: #9A9EA8;
}

.checkbox {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 1.5px solid #C8CBD2;
  flex: none;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 12px;
}

.checkbox-checked {
  background: #FF4A1C;
  border-color: #FF4A1C;
}

.checkbox-checked::after {
  content: "✓";
}

.checkbox-disabled {
  background: #EEE;
  border-color: #DDD;
}

.empty-state {
  min-height: 180px;
  padding: 48px 24px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #9A9EA8;
  text-align: center;
}

.empty-icon {
  width: 48px;
  height: 48px;
  margin-bottom: 10px;
  opacity: 0.72;
}

.empty-title {
  color: #5B5F6B;
  font-size: 14px;
  font-weight: 500;
}

.empty-desc {
  margin-top: 4px;
  color: #9A9EA8;
  font-size: 12px;
}

.gradient-bg-primary {
  background: linear-gradient(160deg, #FF4A1C 0%, #FF6A2B 55%, #FF8A00 100%);
}

.gradient-bg-purple {
  background: linear-gradient(160deg, #6A4CFF, #FF5CA8);
}

.gradient-bg-blue {
  background: linear-gradient(160deg, #2E6BFF, #6FA8FF);
}

.gradient-bg-green {
  background: linear-gradient(160deg, #0FB577, #7ADB5A);
}

.gradient-bg-yellow {
  background: linear-gradient(160deg, #FFB400, #FF7A00);
}

.gradient-bg-dark {
  background: linear-gradient(160deg, #15161C, #2E3140);
}

.img-placeholder {
  border-radius: 12px;
  position: relative;
  overflow: hidden;
}

.img-placeholder::after {
  content: "";
  position: absolute;
  width: 46%;
  height: 46%;
  left: 27%;
  top: 27%;
  border-radius: 30%;
  background: rgba(255, 255, 255, 0.55);
  transform: rotate(12deg);
}

.img-placeholder-1 { background: linear-gradient(135deg, #FFE3D6, #FFC2A8); }
.img-placeholder-2 { background: linear-gradient(135deg, #E3ECFF, #BFD3FF); }
.img-placeholder-3 { background: linear-gradient(135deg, #DDF7EC, #AEEBD1); }
.img-placeholder-4 { background: linear-gradient(135deg, #FFF3C9, #FFE08A); }
.img-placeholder-5 { background: linear-gradient(135deg, #F0E6FF, #D6C2FF); }
.img-placeholder-6 { background: linear-gradient(135deg, #EDEEF2, #D5D8E0); }

/* Shared marketing / list page hero (inset card + lifted content below) */
.page-hero {
  position: relative;
  margin: 12px 12px 0;
  padding: 20px 16px 32px;
  border-radius: 16px;
  overflow: hidden;
  color: #fff;
  box-sizing: border-box;
}

.page-hero-primary {
  background: linear-gradient(160deg, #FF4A1C 0%, #FF6A2B 55%, #FF8A00 100%);
}

.page-hero-purple {
  background: linear-gradient(150deg, #6A4CFF, #FF5CA8);
}

.page-hero-gold {
  background: linear-gradient(150deg, #FFB400, #FF7A00);
}

.page-hero-green {
  background: linear-gradient(150deg, #0FB577, #7ADB5A);
}

.page-hero-blue {
  background: linear-gradient(150deg, #2E6BFF, #6FA8FF);
}

.page-hero-dark {
  background: linear-gradient(150deg, #15161C, #2E3140);
}

.hero-blob {
  position: absolute;
  width: 220px;
  height: 220px;
  right: -60px;
  top: -80px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.12);
  pointer-events: none;
}

.hero-kicker {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 3px;
  line-height: 1.45;
  opacity: 0.7;
}

.hero-heading {
  margin-top: 8px;
  font-size: 26px;
  font-weight: 900;
  line-height: 1.25;
}

.hero-desc {
  margin-top: 6px;
  font-size: 13px;
  line-height: 1.55;
  opacity: 0.85;
}

.hero-top-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
}

.hero-title-stack {
  flex: 1;
  min-width: 0;
}

.hero-title-stack .hero-heading {
  margin-top: 6px;
}

.hero-action-pill,
.hero-count-pill {
  flex: none;
  height: 28px;
  margin-top: 14px;
  padding: 0 12px;
  border: 1px solid rgba(255, 255, 255, 0.55);
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.22);
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  line-height: 26px;
  text-align: center;
  box-sizing: border-box;
}

.hero-count-pill {
  border: 0;
  background: #fff;
  color: #FF4A1C;
  line-height: 28px;
}

.hero-chips-slot {
  margin-top: 14px;
  padding-bottom: 2px;
}

.hero-badge {
  /* legacy: use hero-count-pill in hero-top-row */
  padding: 4px 12px;
  border-radius: 14px;
  background: #fff;
  color: #FF4A1C;
  font-size: 13px;
  font-weight: 800;
}

.hero-chip-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 10px;
}

.hero-chip {
  display: flex;
  align-items: center;
  height: 28px;
  padding: 0 14px;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.18);
  color: #fff;
  font-size: 12px;
}

.hero-chip-on {
  background: #fff;
  color: #FF4A1C;
  font-weight: 700;
}

.page-body {
  padding: 0 16px 24px;
  box-sizing: border-box;
}

/* Positive gap after inset page-hero (do not use negative overlap) */
.page-body-lift {
  margin-top: 16px;
  position: relative;
  z-index: 1;
}

.page-body-lift > .section-title:first-child,
.page-body-lift > .page-section-head:first-child,
.page-body-lift > .mall-notice:first-child {
  margin-top: 0;
}

.page-section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 16px 0 10px;
}

.page-section-title {
  font-size: 17px;
  font-weight: 800;
  color: #15161C;
}

.page-section-tip {
  font-size: 12px;
  color: #9A9EA8;
}

.st-pill {
  display: inline-flex;
  align-items: center;
  padding: 3px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
}

.st-pill-orange {
  background: #FFF1EB;
  color: #FF4A1C;
}

.st-pill-green {
  background: #E6FBF2;
  color: #16C47F;
}

.st-pill-gray {
  background: #ECEDF0;
  color: #9A9EA8;
}

.st-pill-blue {
  background: #E3ECFF;
  color: #3D7BFF;
}

.empty-state2 {
  padding: 36px 16px;
  text-align: center;
}

.empty-state2-symbol {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 84px;
  height: 84px;
  margin: 0 auto 12px;
  border-radius: 28px;
  background: linear-gradient(135deg, #FFF1EB, #FFE0D2);
  color: #FF4A1C;
  font-size: 28px;
  font-weight: 900;
}

.empty-state2-title {
  display: block;
  font-size: 16px;
  font-weight: 800;
  color: #15161C;
}

.empty-state2-desc {
  display: block;
  margin-top: 5px;
  font-size: 12px;
  color: #9A9EA8;
}

.empty-state2 button,
.empty-state2 .btn {
  display: flex;
  margin: 14px auto 0;
}

.page-end-note {
  margin: 14px 0;
  text-align: center;
  font-size: 12px;
  color: #9A9EA8;
}

.field-textarea {
  width: 100%;
  min-height: 96px;
  padding: 12px 14px;
  border-radius: 14px;
  background: #F6F6F8;
  font-size: 14px;
  color: #15161C;
  box-sizing: border-box;
}

.field-input-row {
  display: flex;
  align-items: center;
  height: 44px;
  padding: 0 14px;
  border-radius: 12px;
  background: #F6F6F8;
  font-size: 14px;
  color: #15161C;
}

.check-row {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: #5B5F6B;
}

.check-box {
  width: 18px;
  height: 18px;
  border-radius: 5px;
  border: 1px solid #C8CBD2;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  color: transparent;
}

.check-box-on {
  background: #FF4A1C;
  border-color: #FF4A1C;
  color: #fff;
}

.qa-tag {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 18px;
  height: 18px;
  padding: 0 4px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 800;
  color: #fff;
}

.qa-tag-q {
  background: #15161C;
}

.qa-tag-a {
  background: #FF4A1C;
}

.topic-page {
  min-height: 100vh;
  background: #F6F6F8;
}

.topic-state {
  min-height: 70vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
  text-align: center;
}

.loading-label {
  margin-top: 10px;
  color: #9A9EA8;
  font-size: 12px;
}

.loading-spinner {
  width: 24px;
  height: 24px;
  border: 2.5px solid #ECEDF0;
  border-top-color: #FF4A1C;
  border-radius: 50%;
  animation: topic-spin 0.8s linear infinite;
}

@keyframes topic-spin {
  to { transform: rotate(360deg); }
}

.topic-home-btn {
  margin-top: 14px;
  min-width: 120px;
}

.topic-content {
  padding: 12px 12px 0;
  box-sizing: border-box;
}

.topic-cover-card {
  border-radius: 16px;
  overflow: hidden;
  background: #fff;
  box-shadow: 0 4px 18px rgba(20, 22, 28, 0.06);
}

.topic-cover-media {
  position: relative;
  width: 100%;
  padding-top: 56.25%;
  overflow: hidden;
  background: #ECEDF0;
}

.topic-cover-image,
.topic-cover-placeholder {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.topic-cover-placeholder {
  background: linear-gradient(135deg, #2B2E3A, #FF4A1C);
}

.topic-cover-blob {
  position: absolute;
  right: -30px;
  top: -30px;
  width: 180px;
  height: 180px;
  border-radius: 50px;
  background: rgba(255, 255, 255, 0.12);
  transform: rotate(20deg);
}

.topic-cover-shade {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(21, 22, 28, 0.08) 0%, rgba(21, 22, 28, 0.55) 72%, rgba(21, 22, 28, 0.72) 100%);
  pointer-events: none;
}

.topic-cover-copy {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 1;
  padding: 14px 16px 16px;
  color: #fff;
  box-sizing: border-box;
}

.topic-cover-title {
  margin-top: 4px;
  font-size: 22px;
  font-weight: 900;
  line-height: 1.2;
  letter-spacing: -0.25px;
}

.topic-cover-summary {
  margin-top: 6px;
  font-size: 13px;
  line-height: 1.55;
  color: rgba(255, 255, 255, 0.9);
  display: -webkit-box;
  overflow: hidden;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}

.topic-body {
  margin-top: 16px;
}

.topic-block {
  margin-top: 10px;
  padding: 14px;
  box-sizing: border-box;
}

.topic-block:first-child {
  margin-top: 0;
}

.block-title {
  margin-bottom: 6px;
  font-size: 16px;
  font-weight: 800;
  color: #15161C;
}

.block-body {
  font-size: 14px;
  line-height: 1.8;
  color: #5B5F6B;
  white-space: pre-wrap;
}

.content-image {
  display: block;
  width: 100%;
  max-height: 330px;
  margin: 8px 0;
  border-radius: 12px;
}

.topic-products-head {
  margin: 0 0 10px;
}

.products-block {
  padding-bottom: 4px;
}

.topic-product-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.topic-product-card {
  min-width: 0;
  overflow: hidden;
  border-radius: 14px;
  background: #F6F6F8;
}

.topic-product-media {
  position: relative;
  width: 100%;
  padding-top: 100%;
  background: #fff;
}

.topic-product-image {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
}

.topic-product-info {
  padding: 9px 10px 11px;
  background: #fff;
}

.topic-product-name {
  min-height: 36px;
  color: #15161C;
  font-size: 13px;
  line-height: 18px;
  font-weight: 700;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
