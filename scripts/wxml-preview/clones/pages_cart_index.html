<!DOCTYPE html><html><head><meta charset="utf-8"><style>

page {
  font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'PingFang SC', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif;
  font-size: 14px;
  color: #15161C;
  background: #F6F6F8;
  --tab-bar-gap: 18px;
  --tab-bar-height: 62px;
  --tab-bar-inset: calc(var(--tab-bar-gap) + var(--tab-bar-height) + env(safe-area-inset-bottom));
  --tab-page-pad-bottom: calc(100px + env(safe-area-inset-bottom));
  --cart-checkout-height: 64px;
  --cart-page-pad-bottom: calc(100px + var(--cart-checkout-height) + 48px + env(safe-area-inset-bottom));
}

page, view, text { box-sizing: border-box; }

button {
  margin: 0;
  padding: 0;
  border: none;
  font-family: inherit;
  font-size: inherit;
  font-weight: inherit;
  color: inherit;
  line-height: inherit;
  background: transparent;
  box-sizing: border-box;
  width: auto;
  min-height: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  vertical-align: middle;
}

button::after {
  display: none;
  border: none;
}

button.btn-block,
.btn-block {
  width: 100%;
  display: flex;
  box-sizing: border-box;
}

button.btn-inline,
.btn-inline {
  width: auto;
  flex: none;
  display: inline-flex;
  max-width: none;
}

.page-shell {

}

.price,

.text-primary { color: #15161C; }

.pad-custom-tab-bar {
  /* Fallback first: WXSS may drop the whole rule if calc(var()+env()) is invalid */
  padding-bottom: 100px;
  padding-bottom: calc(100px + constant(safe-area-inset-bottom));
  padding-bottom: calc(100px + env(safe-area-inset-bottom));
  box-sizing: border-box;
}

/* Tab roots must not use padding shorthand with bottom 0 — it overrides this utility (see order/list, category). */
.home.pad-custom-tab-bar,
.cat-page.pad-custom-tab-bar,
.order-list-page.pad-custom-tab-bar,
.my-page.pad-custom-tab-bar {
  padding-bottom: 100px;
  padding-bottom: calc(100px + constant(safe-area-inset-bottom));
  padding-bottom: calc(100px + env(safe-area-inset-bottom));
}

.pad-custom-tab-bar-cart {
  padding-bottom: 180px;
  padding-bottom: calc(180px + constant(safe-area-inset-bottom));
  padding-bottom: calc(180px + env(safe-area-inset-bottom));
  box-sizing: border-box;
}

/* In-flow scroll extent (reliable vs page padding alone): tab 36+124 + margin */
.tab-bottom-spacer {
  width: 100%;
  height: 100px;
  height: calc(100px + constant(safe-area-inset-bottom));
  height: calc(100px + env(safe-area-inset-bottom));
  flex-shrink: 0;
}

/* Checkout bar (~84px) + tab-bar-inset (36+124) + safe area */
.cart-bottom-spacer {
  width: 100%;
  height: 180px;
  height: calc(180px + constant(safe-area-inset-bottom));
  height: calc(180px + env(safe-area-inset-bottom));
  flex-shrink: 0;
}

.pad-fixed-bottom-bar {
  padding-bottom: calc(78px + env(safe-area-inset-bottom));
  box-sizing: border-box;
}

.text-ellipsis {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
}

.fixed-above-custom-tab-bar {
  bottom: var(--tab-bar-inset);
}

.img-placeholder {
