 .ph{height:660px} .mask{flex-direction:column} .gg{grid-template-columns:repeat(3,375px)}</style></head><body style="width:1253px"><h1>弹窗规范 · 积分</h1><div style="color:var(--t2);margin-top:4px">确认兑换、签到/领券/兑换按钮状态、流水与记录标签</div><div class="gg"><div><h3>① 积分商城 · 确认兑换</h3><div class="ph"><div class="mask"><div style="display:flex;flex-direction:column;align-items:center"><div class="md" style="margin:8px 0"><div class="t">确认兑换</div><div class="c">将使用 500 积分兑换好礼名称，商家包邮</div><div class="acts"><div class="btn ">取消</div><div class="btn pri">确定</div></div></div></div></div></div></div><div><h3>② 签到 / 领券 / 兑换按钮状态</h3><div class="ph" style="height:auto;background:#fff;padding:18px"><div class="row"><div class="btn pri">签到领积分</div><div class="btn" style="background:#E6FBF2;color:var(--g);border:0">✓ 已签到</div></div><div class="row"><div class="btn pri sm">立即领取</div><div class="btn sm pri" style="opacity:.7">领取中</div><div class="btn sm" style="background:#E6FBF2;color:var(--g);border:0">已领取</div></div><div class="row"><div class="btn pri sm">立即兑换</div><div class="btn sm pri dis">兑换中</div><div class="btn sm dis">积分不足</div><div class="btn sm dis">已兑完</div></div><div class="row"><span class="toast">✓ 签到成功</span><span class="toast">✓ 会员券已到账</span><span class="toast">✓ 兑换成功</span></div></div></div><div><h3>③ 积分流水 / 记录状态</h3><div class="ph" style="height:auto;background:#fff;padding:18px"><div class="row"><b style="color:var(--g)">+10</b> 收入 <b style="color:var(--p)">-500</b> 支出</div><div class="row"><span class="tag">实物</span><span class="tag">优惠券</span><span class="st g">已发货</span><span class="st">待发货</span><span class="st k">已取消</span></div><div class="row"><span class="chip on" style="height:28px">已选地址 ›</span><span class="chip" style="height:28px;background:var(--bg)">选择收货地址 ›</span></div></div></div></div></body></html>
